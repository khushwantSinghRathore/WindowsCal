<ion-content fullscreen>

  <div class="controls">

    <ion-grid>
      <ion-row *ngIf="perv">
        <ion-col size="12"></ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <ion-input placeholder="0" style="text-align: end; font-size: xxx-large !important;" readonly="true">
          </ion-input>
        </ion-col>
      </ion-row>
      <ion-row *ngFor="let data of displayBtn">
        <ion-col class="Container ion-align-self-center" size="2.8" *ngFor="let btn of data "
          [ngClass]="{'Container2': btn === '='}"> {{ btn }} </ion-col>
      </ion-row>
    </ion-grid>

  </div>


</ion-content>
