<ion-app>
  <ion-menu side="start" menuId="first" contentId="main">
    <ion-content>

      <ion-modal #modal trigger="open-about" [initialBreakpoint]="0.6" [breakpoints]="[0,0.6]">
        <ng-template>
          <ion-content>
            <ion-grid class="aboutmodel">
              <ion-row>
                <ion-col size="12" style="font-size:xx-large; margin-bottom: 2vh;">
                  About
                </ion-col>
                <ion-col size="12">
                  Calculator 11.2204.4.0
                </ion-col>
                <ion-col size="12">
                  © 2022 Microsoft. All rights reserved.
                </ion-col>
                <ion-col size="12">
                  <p href="https://www.microsoft.com/en-us/Useterms/Retail/Windows/10/UseTerms_Retail_Windows_10_English.html">
                    Microsoft License Terms </p>
                </ion-col>
                <ion-col size="12">
                  <p href="https://www.microsoft.com/en-us/servicesagreement/default.aspx"> Microsoft Services Agreement </p>
                </ion-col>
                <ion-col size="12">
                  <p href="https://privacy.microsoft.com/en-us/privacystatement"> Microsoft Privacy Statement </p>
                </ion-col>
                <ion-col size="12">
                  <ion-button color="medium" mode="ios" size="large" >
                    Send feedback
                  </ion-button>
                </ion-col>
                <ion-col size="12">
                  <p> To learn how you can contribute to Windows Calculator, check out the project on <span href="https://github.com/Microsoft/calculator">GitHub</span>.</p>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-content>
        </ng-template>
      </ion-modal>

      <div class="about">
        <ion-grid>
          <ion-row>
            <ion-col size="2" class="icon">
              <ion-icon name="alert-circle-outline"></ion-icon>
            </ion-col>
            <ion-col id="open-about">
              <ion-label>
                About
              </ion-label>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main"></ion-router-outlet>
</ion-app>
